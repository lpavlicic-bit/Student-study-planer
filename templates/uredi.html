{% extends "base.html" %}

{% block page_title %}Uredi sesiju{% endblock %}

{% block content %}
<div class="form-card">

    <p class="label">Uređivanje</p>
    <h2>Uredi sesiju #{{ sesija.id }}</h2>

    <form method="POST" class="custom-form">
        <div class="form-group">
            <label>Kolegij</label>
            <input type="text" name="kolegij" 
            value="{{ sesija.kolegij }}" required>
        </div>

        <div class="form-group">
            <label>Datum</label>
            <input type="date" name="datum" 
            value="{{ sesija.datum }}" required>
        </div>

        <div class="form-group">
            <label>Broj sati</label>
            <input type="number" step="0.5" 
            min="0.5" name="sati" 
            value="{{ sesija.sati }}" required>
        </div>

        <div class="form-group">
            <label>Tema</label>
            <input type="text" name="tema" 
            value="{{ sesija.tema }}" required>
        </div>

        <button type="submit" 
        class="primary-btn full-width">Spremi promjene</button>
    </form>

</div>
{% endblock %}
